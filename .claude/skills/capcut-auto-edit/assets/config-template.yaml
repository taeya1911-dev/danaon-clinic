# 캡컷 자동 편집 설정
# 값은 반드시 측정해서 채운다. 비워두면 스크립트가 추정치를 쓰고 그 사실을 로그로 알린다.

# ── 3단계(기존 프로젝트 조사)에서 채움 ────────────────────────────
subtitle:
  font_size_ratio:          # 캔버스 높이 대비 비율. 해상도가 바뀌어도 유지되도록 절대 픽셀 대신 사용
  font_family:
  color:
  outline:                  # 외곽선/그림자 유무와 색
  position_y:               # 화면 하단 기준 상대 위치
  max_chars_per_line: 20    # 세로 영상이면 12 근처
  max_lines: 2
  min_duration_sec: 1.0     # 최소 노출 시간 — 이보다 짧으면 못 읽는다
  max_cps: 9                # 초당 읽기 글자 수 상한

# ── 4단계(내 편집본 역분석)에서 채움 ──────────────────────────────
cut:
  silence_threshold_db: -35 # 이보다 조용하면 무음 후보
  min_silence_sec: 0.8      # 이보다 짧은 정적은 건드리지 않음
  keep_silence_sec: 0.5     # 무음을 여기까지만 줄임 (0이면 완전 삭제)
  pad_before_sec: 0.15      # 발화 시작 전 남길 여백 — 0이면 숨소리가 잘린다
  pad_after_sec: 0.25
  min_clip_sec: 1.0         # 이보다 짧은 클립은 앞 클립에 병합

# ── 8단계 보호 규칙 ───────────────────────────────────────────────
# 오디오만 보면 말없이 시연하는 구간이 통째로 날아간다.
protect:
  scene_change_threshold: 0.30  # 이 이상 화면이 변하면 무음이어도 보존 (0~1)
  manual_keep: []               # ["00:01:23-00:01:45"] 형식으로 직접 지정

transcribe:
  model:                    # 사용하는 음성인식 모델명 — 캐시 키에 포함된다
  language: ko
  cache_dir: .cache/transcripts
